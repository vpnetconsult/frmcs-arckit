<svg xmlns="http://www.w3.org/2000/svg" width="680" height="612" viewBox="0 0 680 612" role="img">
<title>arcKit phase-gate plan for the agentic oversight project</title>
<desc>Outcome anchors the plan. Six phases run in sequence, each ending at a gate: P0 mobilise and govern (G0 constraints verified), P1 as-is discovery (G1), P2 to-be architecture (G2), P3 build and eval (G3), P4 assure (G4), P5 operate via the shadow to advisory to bounded autonomy ladder (G5). Every gate is an arcKit checkpoint. Safety-critical action stays human-in-command throughout.</desc>
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif;}
.th{font-size:14px;font-weight:500;}
.ts{font-size:12px;font-weight:400;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="612" fill="#FFFFFF"/>

<rect x="80" y="20" width="520" height="44" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central" fill="#085041">Outcome: safe, continuous rail operations</text>
<text class="ts" x="340" y="54" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">every phase and gate serves this</text>

<line x1="340" y1="64" x2="340" y2="84" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="80" y="86" width="520" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="106" text-anchor="middle" dominant-baseline="central" fill="#3C3489">P0 · Mobilise &amp; govern</text>
<text class="ts" x="340" y="124" text-anchor="middle" dominant-baseline="central" fill="#534AB7">G0 — constraints verified, charter signed</text>
<line x1="340" y1="138" x2="340" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="80" y="158" width="520" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="178" text-anchor="middle" dominant-baseline="central" fill="#3C3489">P1 · As-is discovery</text>
<text class="ts" x="340" y="196" text-anchor="middle" dominant-baseline="central" fill="#534AB7">G1 — process + telemetry validated</text>
<line x1="340" y1="210" x2="340" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="80" y="230" width="520" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="250" text-anchor="middle" dominant-baseline="central" fill="#3C3489">P2 · To-be architecture &amp; ADRs</text>
<text class="ts" x="340" y="268" text-anchor="middle" dominant-baseline="central" fill="#534AB7">G2 — ADRs decided, ARB endorses</text>
<line x1="340" y1="282" x2="340" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="80" y="302" width="520" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="322" text-anchor="middle" dominant-baseline="central" fill="#3C3489">P3 · Build + eval harness</text>
<text class="ts" x="340" y="340" text-anchor="middle" dominant-baseline="central" fill="#534AB7">G3 — thresholds met, incident-replay green</text>
<line x1="340" y1="354" x2="340" y2="372" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="80" y="374" width="520" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="394" text-anchor="middle" dominant-baseline="central" fill="#3C3489">P4 · Assure</text>
<text class="ts" x="340" y="412" text-anchor="middle" dominant-baseline="central" fill="#534AB7">G4 — safety case + NSA sign-off</text>
<line x1="340" y1="426" x2="340" y2="444" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="80" y="446" width="520" height="58" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="340" y="466" text-anchor="middle" dominant-baseline="central" fill="#633806">P5 · Operate — autonomy ladder</text>
<text class="ts" x="340" y="484" text-anchor="middle" dominant-baseline="central" fill="#854F0B">shadow → advisory → bounded · G5 each step authorised</text>
<line x1="340" y1="504" x2="340" y2="522" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="80" y="524" width="520" height="44" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="542" text-anchor="middle" dominant-baseline="central" fill="#085041">Governed operation</text>
<text class="ts" x="340" y="558" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">safety-critical action stays human-in-command</text>

<text class="ts" x="80" y="588" text-anchor="start" fill="#5F5E5A">Each gate = ADR decided · matrix updated · evidence logged · baseline cut</text>
</svg>
