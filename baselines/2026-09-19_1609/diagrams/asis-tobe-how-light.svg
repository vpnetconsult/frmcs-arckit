<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img">
<title>As-is, to-be and how: GSM-R to FRMCS transition</title>
<desc>As-is: GSM-R 2G with a central single point of failure that must change. To-be: FRMCS 5G standalone transport as an enabler, with autonomy as a separate layer riding on top — 5G carries autonomy but does not decide. How: a phased, governed transition. The outcome anchors all three.</desc>
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif;}
.th{font-size:14px;font-weight:500;}
.ts{font-size:12px;font-weight:400;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="540" fill="#FFFFFF"/>

<rect x="40" y="20" width="600" height="44" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central" fill="#085041">Outcome: safe, continuous rail operations</text>
<text class="ts" x="340" y="54" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">the constant across as-is, to-be and how</text>

<line x1="340" y1="64" x2="340" y2="84" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="86" width="600" height="118" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="56" y="106" text-anchor="start" fill="#444441">As-is · GSM-R (2G)</text>
<text class="ts" x="56" y="122" text-anchor="start" fill="#5F5E5A">why it must change</text>

<rect x="56" y="136" width="134" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="123" y="158" text-anchor="middle" dominant-baseline="central" fill="#712B13">2G bearer</text>
<text class="ts" x="123" y="175" text-anchor="middle" dominant-baseline="central" fill="#993C1D">~9.6 kbit/s</text>

<rect x="200" y="136" width="134" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="267" y="158" text-anchor="middle" dominant-baseline="central" fill="#712B13">Central SPOF</text>
<text class="ts" x="267" y="175" text-anchor="middle" dominant-baseline="central" fill="#993C1D">one fault halts</text>

<rect x="344" y="136" width="134" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="411" y="158" text-anchor="middle" dominant-baseline="central" fill="#712B13">Ceiling</text>
<text class="ts" x="411" y="175" text-anchor="middle" dominant-baseline="central" fill="#993C1D">no ATO / video</text>

<rect x="488" y="136" width="134" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="555" y="158" text-anchor="middle" dominant-baseline="central" fill="#712B13">Obsolete</text>
<text class="ts" x="555" y="175" text-anchor="middle" dominant-baseline="central" fill="#993C1D">exit ~2030</text>

<line x1="340" y1="204" x2="340" y2="224" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="226" width="600" height="150" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="56" y="246" text-anchor="start" fill="#444441">To-be · FRMCS (5G SA)</text>
<text class="ts" x="56" y="262" text-anchor="start" fill="#5F5E5A">an enabler — not autonomy itself</text>

<rect x="56" y="276" width="360" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="236" y="291" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Autonomy layer</text>
<text class="ts" x="236" y="307" text-anchor="middle" dominant-baseline="central" fill="#534AB7">ATO + agentic decisions · rides on top</text>

<rect x="56" y="324" width="360" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="236" y="339" text-anchor="middle" dominant-baseline="central" fill="#085041">FRMCS transport</text>
<text class="ts" x="236" y="355" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">5G SA + MCX · geo-redundant bearer</text>

<rect x="432" y="288" width="190" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="527" y="312" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">5G carries autonomy.</text>
<text class="th" x="527" y="330" text-anchor="middle" dominant-baseline="central" fill="#993C1D">It does not decide.</text>

<line x1="340" y1="376" x2="340" y2="396" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="398" width="600" height="118" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="56" y="418" text-anchor="start" fill="#444441">How · phased + governed</text>
<text class="ts" x="56" y="434" text-anchor="start" fill="#5F5E5A">every step serves the outcome</text>

<rect x="56" y="448" width="134" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="123" y="470" text-anchor="middle" dominant-baseline="central" fill="#633806">Parallel run</text>
<text class="ts" x="123" y="487" text-anchor="middle" dominant-baseline="central" fill="#854F0B">dual network</text>

<rect x="200" y="448" width="134" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="267" y="470" text-anchor="middle" dominant-baseline="central" fill="#633806">Decouple</text>
<text class="ts" x="267" y="487" text-anchor="middle" dominant-baseline="central" fill="#854F0B">bearer-flex</text>

<rect x="344" y="448" width="134" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="411" y="470" text-anchor="middle" dominant-baseline="central" fill="#633806">Kill the SPOF</text>
<text class="ts" x="411" y="487" text-anchor="middle" dominant-baseline="central" fill="#854F0B">geo-redundant</text>

<rect x="488" y="448" width="134" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="555" y="470" text-anchor="middle" dominant-baseline="central" fill="#633806">Govern</text>
<text class="ts" x="555" y="487" text-anchor="middle" dominant-baseline="central" fill="#854F0B">HITL + SIL-4</text>
</svg>
